name: hardflow-v1
args:
  task:
    default: ""
  max_retries:
    default: "3"
  score_max_retries:
    default: "3"

steps:
  - id: classify
    command: bash scripts/hardflow/hardflow-run.sh classify --task "$args.task"

  - id: score_g0_requirements
    command: bash scripts/hardflow/hardflow-run.sh score-gate --gate requirements --max-retries "$args.score_max_retries"

  - id: dispatch
    command: bash scripts/hardflow/hardflow-run.sh dispatch

  - id: score_g1_solution
    command: bash scripts/hardflow/hardflow-run.sh score-gate --gate solution --max-retries "$args.score_max_retries"

  - id: implement
    command: bash scripts/hardflow/hardflow-run.sh implement

  - id: test_loop
    command: bash scripts/hardflow/hardflow-run.sh test-loop --max-retries "$args.max_retries"

  - id: review
    command: bash scripts/hardflow/hardflow-run.sh review

  - id: score_g2_frontend
    command: bash scripts/hardflow/hardflow-run.sh score-gate --gate frontend --max-retries "$args.score_max_retries"

  - id: score_g3_backend
    command: bash scripts/hardflow/hardflow-run.sh score-gate --gate backend --max-retries "$args.score_max_retries"

  - id: score_g4_security
    command: bash scripts/hardflow/hardflow-run.sh score-gate --gate security --max-retries "$args.score_max_retries"

  - id: api_doc_gate
    command: bash scripts/hardflow/check-api-doc-gate.sh

  - id: quality_gate_predeploy
    command: bash scripts/hardflow/check-review-test-gate.sh --stage predeploy

  - id: preview_deploy
    command: bash scripts/hardflow/preview-action.sh deploy

  - id: deploy
    command: bash scripts/hardflow/hardflow-run.sh deploy

  - id: post_test
    command: bash scripts/hardflow/hardflow-run.sh post-test || true

  - id: score_g5_release
    command: bash scripts/hardflow/hardflow-run.sh score-gate --gate release --max-retries "$args.score_max_retries"

  - id: score_g6_final
    command: bash scripts/hardflow/hardflow-run.sh score-gate --gate final --max-retries "$args.score_max_retries"

  - id: quality_gate_postdeploy
    command: bash scripts/hardflow/check-review-test-gate.sh --stage postdeploy

  - id: preview_git_push
    command: bash scripts/hardflow/preview-action.sh git-push

  - id: git_push
    command: bash scripts/hardflow/hardflow-run.sh git-push

  - id: score_report
    command: bash scripts/hardflow/hardflow-run.sh score-report --format text
