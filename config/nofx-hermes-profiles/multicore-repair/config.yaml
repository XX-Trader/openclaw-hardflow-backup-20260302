worktree: true
approvals:
  mode: 'off'
command_allowlist: []
security:
  redact_secrets: true
  tirith_enabled: false
terminal:
  backend: local
  cwd: /home/arbops/projects/SmartMultiPlatformArbitrage
  timeout: 180
agent:
  max_turns: 90
  gateway_notify_interval: 0
discord:
  allowed_channels: '1499325163047747645,1494595613159850086'
  require_mention: true
  free_response_channels: '1499325163047747645,1494595613159850086'
  auto_thread: true
  reactions: true
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
display:
  tool_progress: false
  background_process_notifications: false
model:
  provider: openai-codex
  default: gpt-5.5
  base_url: https://chatgpt.com/backend-api/codex
fallback_model:
  provider: kimi-coding
  model: kimi-k2.6

plugins:
  enabled:
  - hermes-lcm
context:
  engine: lcm

compression:
  enabled: true
  threshold: 0.73
