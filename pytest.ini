[pytest]
addopts = --strict-markers
testpaths =
    tests
    skills/library/pdf/scripts
markers =
    quick: fast checks for policy, entry points, routing, and configuration parsing
    integration: broader component and end-to-end checks; disjoint from quick
norecursedirs =
    .git
    .agents
    .codex-tmp
    .codex_tmp_openclaw_upgrade
    .pytest_cache
    .tmp
    af39077
    foo
    tmp
    vendor
    node_modules
cache_dir = .tmp/pytest-cache
